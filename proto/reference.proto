syntax = "proto3";

package bello.reference.v1;

service ReferenceService {
  rpc WatchReference(WatchReferenceRequest) returns (stream WatchReferenceResponse);
}

message WatchReferenceRequest {
  uint32 protocol_version = 1;
  string robot_model_sha256 = 2;
}

enum ReferenceMode {
  REFERENCE_MODE_UNSPECIFIED = 0;
  REFERENCE_MODE_ACTIVE = 1;
  REFERENCE_MODE_HOLD = 2;
  REFERENCE_MODE_STOP = 3;
}

message ReferenceStreamInfo {
  uint32 protocol_version = 1;
  string robot = 2;
  string robot_model_sha256 = 3;
  repeated string joint_names = 4;
  string source_id = 5;
  double nominal_rate_hz = 6;
}

message ReferenceFrame {
  uint64 sequence = 1;
  uint64 source_monotonic_ns = 2;
  repeated double root_translation_metres = 3;
  repeated double root_orientation_wxyz = 4;
  repeated double root_linear_velocity_local = 5;
  repeated double root_angular_velocity_local = 6;
  repeated double joint_position = 7;
  ReferenceMode mode = 8;
  uint64 sample_age_ms = 9;
}

message WatchReferenceResponse {
  oneof payload {
    ReferenceStreamInfo info = 1;
    ReferenceFrame frame = 2;
  }
}
